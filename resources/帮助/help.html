<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>{{ title }}</title>
  <base href="{{ _baseUrl }}/">
  <style>
    :root {
      --bg: #0f1210;
      --sheet: #171b17;
      --line: #2c352c;
      --ink: #e4ebdf;
      --dim: #8a9584;
      --cmd: #b6e36a;
      --head: #f0c35a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Cascadia Mono", "Sarasa Mono SC", "Consolas", "Microsoft YaHei UI", monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    #container {
      max-width: 752px;
      margin: 0 auto;
      background: var(--sheet);
      border: 1px solid var(--line);
    }
    .mast {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }
    .mast h1 {
      font-size: 20px;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: #f5f8f1;
    }
    .mast h1 i {
      font-style: normal;
      color: var(--cmd);
      margin-right: 6px;
    }
    .mast .sub {
      color: var(--dim);
      font-size: 12px;
    }
    .block {
      padding: 14px 20px 16px;
      border-bottom: 1px solid var(--line);
    }
    .block:last-of-type { border-bottom: none; }
    .name {
      margin-bottom: 10px;
      color: var(--head);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }
    .name::before {
      content: "// ";
      color: var(--dim);
      letter-spacing: 0;
    }
    .rows {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 28px;
      row-gap: 6px;
    }
    .rows.one { grid-template-columns: 1fr; }
    .item {
      display: grid;
      grid-template-columns: minmax(88px, max-content) 1fr;
      gap: 8px 12px;
      align-items: baseline;
      min-width: 0;
    }
    .cmd {
      color: var(--cmd);
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
    }
    .desc {
      color: var(--ink);
      opacity: 0.88;
      font-size: 12.5px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 12px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .foot b { color: var(--cmd); font-weight: 700; }
  </style>
</head>
<body>
  <div id="container">
    <header class="mast">
      <h1><i>$</i>{{ title }}</h1>
      <div class="sub">{{ subtitle }}</div>
    </header>
    {{ each sections }}
    <section class="block">
      <div class="name">{{ $value.name }}</div>
      <div class="rows{{ if $value.full || ($value.items && $value.items.length < 3) }} one{{ /if }}">
        {{ each $value.items }}
        <div class="item"><span class="cmd">{{ $value.cmd }}</span><span class="desc">{{ $value.desc }}</span></div>
        {{ /each }}
      </div>
    </section>
    {{ /each }}
    <footer class="foot">
      <span><b>{{ footer }}</b></span>
      <span>help</span>
    </footer>
  </div>
</body>
</html>
